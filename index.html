<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darvas Box Breakout Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-white">Darvas Box Breakout Dashboard</h1>
        <p class="text-slate-400 text-sm">Automated Daily Swing Trading Signals</p>
      </div>
      <div class="text-xs bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-emerald-400 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Live Daily Data
      </div>
    </header>

    <!-- Table Container -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
      <div id="loading" class="p-8 text-center text-slate-400">Loading scan results...</div>
      <table id="results-table" class="w-full text-left text-sm hidden">
        <thead class="bg-slate-950 text-slate-400 uppercase text-xs border-b border-slate-800">
          <tr>
            <th class="px-6 py-4">Date</th>
            <th class="px-6 py-4">Ticker</th>
            <th class="px-6 py-4">Close Price</th>
            <th class="px-6 py-4">Box Top</th>
            <th class="px-6 py-4">Signal Status</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-slate-800"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadResults() {
      const loading = document.getElementById('loading');
      const table = document.getElementById('results-table');
      const body = document.getElementById('table-body');

      try {
        // Fetch JSON output generated by GitHub Actions
        const response = await fetch('./scan_results.json');
        if (!response.ok) throw new Error("No scan results file found yet.");
        
        const data = await response.json();
        loading.classList.add('hidden');
        table.classList.remove('hidden');

        body.innerHTML = data.map(item => `
          <tr class="hover:bg-slate-800/50">
            <td class="px-6 py-4 text-slate-400">${item.Date || 'Today'}</td>
            <td class="px-6 py-4 font-bold text-white font-mono">${item.Ticker}</td>
            <td class="px-6 py-4">₹${item.Close || item.Latest_Close}</td>
            <td class="px-6 py-4 text-slate-400">₹${item.Box_Top}</td>
            <td class="px-6 py-4">
              ${item.Bull_BO || item.Bull_BO_Today ? '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">🟢 Breakout</span>' : ''}
              ${item.Follow_Through || item.Follow_Through_Today ? '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">★ Follow-Through</span>' : ''}
              ${item.Failed_Fakeout || item.Failed_Fakeout_Today ? '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20">✖ Fakeout</span>' : ''}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        loading.innerHTML = `<span class="text-slate-400">Awaiting scan data. Run the workflow under the <b>Actions</b> tab in GitHub to generate <code>scan_results.json</code>.</span>`;
      }
    }

    loadResults();
  </script>
</body>
</html>
