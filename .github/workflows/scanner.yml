name: Daily Darvas Scanner

on:
  schedule:
    # Runs at 10:30 UTC (4:00 PM IST) Monday through Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual run anytime

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install yfinance pandas numpy
      - name: Run Scanner
        run: python scanner.py
      - name: Commit and Push Results
        run: |
          git config --global user.name 'Scanner Bot'
          git config --global user.email 'bot@example.com'
          git add scan_results.json || exit 0
          git commit -m "Automated daily scan update" || exit 0
          git push
